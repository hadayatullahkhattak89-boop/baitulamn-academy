<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="doveGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#F5D061"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A17A16"/>
    </linearGradient>

    <linearGradient id="wingGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFEAA0"/>
      <stop offset="100%" stop-color="#FFFDF5"/>
    </linearGradient>

    <filter id="luxeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0A2540" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#luxeShadow)">
    <!-- Celestial Crescent & Star Crown -->
    <path d="M 100,22 A 7,7 0 1,0 107,32 A 5.5,5.5 0 1,1 100,22 Z" fill="url(#doveGold)"/>
    <polygon points="100,34 101.5,36.8 104.5,37 102.2,39 103,42 100.5,40.4 98,42 98.8,39 96.5,37 99.5,36.8" fill="url(#doveGold)"/>

    <!-- The Sanctuary Arch / Dome Outline (Bait-ul-Amn) -->
    <path d="M 100,44 
             C 74,60 52,86 52,126 
             L 52,160 
             L 148,160 
             L 148,126 
             C 148,86 126,60 100,44 Z" 
          fill="none" 
          stroke="url(#doveGold)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Dotted Filigree Arch -->
    <path d="M 100,54 
             C 78,68 62,90 62,126 
             L 62,156 
             L 138,156 
             L 138,126 
             C 138,90 122,68 100,54 Z" 
          fill="none" 
          stroke="url(#doveGold)" 
          stroke-width="1.4" 
          stroke-dasharray="3, 3" 
          opacity="0.7"/>

    <!-- Wing of Peace & Open Quran: Left Side -->
    <!-- Ascending feathers that double as Qur'an page leaves -->
    <path d="M 100,128 
             C 86,112 66,108 34,102 
             C 44,116 62,126 78,132 
             C 88,136 96,134 100,128 Z" 
          fill="url(#wingGlow)"/>

    <path d="M 100,128 
             C 84,98 62,88 24,80 
             C 38,96 58,110 78,118 
             C 88,122 96,126 100,128 Z" 
          fill="url(#doveGold)" opacity="0.9"/>

    <path d="M 100,128 
             C 84,84 62,68 20,56 
             C 34,74 56,92 78,104 
             C 88,110 96,120 100,128 Z" 
          fill="url(#wingGlow)"/>

    <!-- Wing of Peace & Open Quran: Right Side -->
    <path d="M 100,128 
             C 114,112 134,108 166,102 
             C 156,116 138,126 122,132 
             C 112,136 104,134 100,128 Z" 
          fill="url(#wingGlow)"/>

    <path d="M 100,128 
             C 116,98 138,88 176,80 
             C 162,96 142,110 122,118 
             C 112,122 104,126 100,128 Z" 
          fill="url(#doveGold)" opacity="0.9"/>

    <path d="M 100,128 
             C 116,84 138,68 180,56 
             C 166,74 144,92 122,104 
             C 112,110 104,120 100,128 Z" 
          fill="url(#wingGlow)"/>

    <!-- Open Qur'an Core Foundation (رحل وقرآن) -->
    <!-- Left page -->
    <path d="M 100,128 C 88,118 72,120 62,128 L 62,142 C 72,134 88,132 100,142 Z" 
          fill="url(#doveGold)"/>
    <!-- Right page -->
    <path d="M 100,128 C 112,118 128,120 138,128 L 138,142 C 128,134 112,132 100,142 Z" 
          fill="url(#doveGold)"/>

    <!-- Center Spine & Noor Pillar -->
    <line x1="100" y1="124" x2="100" y2="148" stroke="url(#doveGold)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Wooden Rehal Crossing Support -->
    <path d="M 72,142 L 96,166 L 104,166 L 80,142 Z" fill="url(#doveGold)" opacity="0.85"/>
    <path d="M 128,142 L 104,166 L 96,166 L 120,142 Z" fill="url(#doveGold)" opacity="0.85"/>
    <line x1="56" y1="166" x2="144" y2="166" stroke="url(#doveGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Olive Branch of Peace in Beak / Center Base -->
    <path d="M 88,172 C 94,169 106,169 112,172" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="94" cy="170" r="2" fill="#059669"/>
    <circle cx="100" cy="169" r="2" fill="#059669"/>
    <circle cx="106" cy="170" r="2" fill="#059669"/>
  </g>
</svg>
